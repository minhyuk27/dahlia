{{- with .Site.Params.gcSite }}
{{- if $.IsPage }}
<script>
(function() {
  var path = encodeURIComponent(window.location.pathname);
  fetch('https://{{ . }}.goatcounter.com/counter/' + path + '.json')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.count) return;
      var el = document.querySelector('.post-meta');
      if (!el) return;
      var span = document.createElement('span');
      span.className = 'view-count';
      span.innerHTML = '&nbsp;&middot;&nbsp;조회 ' + d.count;
      el.appendChild(span);
    }).catch(function(){});
})();
</script>
{{- end }}
{{- end }}
